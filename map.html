<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Display a map with a custom style</title>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
</head>
<body>

<link href="https://api.mapbox.com/mapbox-gl-js/v3.16.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.16.0/mapbox-gl.js"></script>
<style>
body {
    margin: 0;
    padding: 0;
}

#map {
    position: relative;
    top: 0;
    bottom: 0;
    width: 100%;
    height: 100vh;
}
.legend {
    background-color: #fff;
    border-radius: 3px;
    bottom: 30px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    font: 12px/20px 'Helvetica Neue', Arial, Helvetica, sans-serif;
    padding: 10px;
    position: absolute;
    right: 10px;
    z-index: 1;
    max-width: 200px;
    transition: transform 0.3s ease, opacity 0.3s ease;
}

.legend.hidden {
    transform: translateX(calc(100% + 10px));
    opacity: 0;
    pointer-events: none;
}

.legend-toggle,
.legend-toggle-tab {
    background-color: #fff;
    border: 1px solid #ddd;
    border-radius: 3px;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
}

.legend-toggle {
    position: absolute;
    top: 5px;
    right: 5px;
    padding: 4px 8px;
    z-index: 2;
}

.legend-toggle-tab {
    position: absolute;
    bottom: 30px;
    right: 10px;
    padding: 8px 12px;
    z-index: 10;
    display: none;
}

.legend-toggle:hover,
.legend-toggle-tab:hover {
    background-color: #f0f0f0;
    border-color: #ccc;
}

.legend-toggle-tab.visible {
    display: block;
}

.legend h4 {
    margin: 0 0 10px;
    font-weight: bold;
}

.legend div span {
    display: inline-block;
    height: 4px;
    margin-right: 5px;
    width: 30px;
    vertical-align: middle;
}

#legend-icon {
    display: inline-block;
    height: 16px;
    width: 16px;
    margin-right: 5px;
    vertical-align: middle;
}

.mapboxgl-popup {
    max-height: 90vh;
}

.mapboxgl-popup-content {
    padding: 15px;
    max-width: 250px;
    overflow-y: auto;
}

.popup-title {
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 10px;
}

.popup-directions {
    display: inline-block;
    margin: 8px 0;
    padding: 5px 10px;
    background-color: #4285f4;
    color: white;
    text-decoration: none;
    border-radius: 3px;
    font-size: 12px;
}

.popup-directions:hover {
    background-color: #357ae8;
}

.popup-description {
    font-size: 12px;
    color: #666;
    margin-top: 8px;
    line-height: 1.4;
}
</style>
<div id="map">
    <div class="legend" id="legend">
        <button class="legend-toggle" id="legend-toggle" onclick="toggleLegend()">»</button>
        <h4>Legend</h4>
        <div id="legend-content">Loading layers...</div>
    </div>
    <button class="legend-toggle-tab" id="legend-toggle-tab" onclick="toggleLegend()">«</button>
</div>
<script>
    // Calculate and set map height based on its position
    let lastOrientation = screen.orientation?.angle;
    
    function setMapHeight() {
        const mapElement = document.getElementById('map');
        const mapTop = mapElement.getBoundingClientRect().top;
        const availableHeight = window.innerHeight - mapTop;
        mapElement.style.height = `${availableHeight}px`;
        lastOrientation = screen.orientation?.angle;
        
        // Tell Mapbox to resize after height change
        if (typeof map !== 'undefined') {
            map.resize();
        }
    }
    
    // Detect if device is mobile/touch
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    console.log('isMobile:', isMobile);
    
    // Set height on load
    window.addEventListener('load', setMapHeight);
    
    // Handle window resize
    window.addEventListener('resize', function() {
        if (isMobile) {
            // On mobile, only resize if orientation changed
            const currentOrientation = screen.orientation?.angle;
            if (currentOrientation !== lastOrientation) {
                setTimeout(setMapHeight, 100);
            }
        } else {
            // On desktop, always resize
            setMapHeight();
        }
    });
    
	mapboxgl.accessToken = 'pk.eyJ1IjoiZ3JvbXBoOTkiLCJhIjoiY2x1NGt5Z3ZnMTd5NzJpbzMwY2g2andtNSJ9.Xks1OhTa4pw29GO4wKzPiw';
    const map = new mapboxgl.Map({
        container: 'map', // container ID
        style: 'mapbox://styles/gromph99/clu4l74hj026e01oigmt295hj/draft',
        center: [-123.12328, 42.42930],
        zoom: 11
    });
    map.addControl(new mapboxgl.FullscreenControl(), 'top-left');

    // Add legend
    map.on('load', function() {
        const layers = map.getStyle().layers;
        const legendContent = document.getElementById('legend-content');
        legendContent.innerHTML = '';
        
        // Define which layers to include in legend
        const includedLayers = ['Rogue River Greenway', 'Bikelane', 'Proposed', 'Point of Interest', 'Bear Creek Greenway'];
        
        // Iterate through includedLayers to maintain order
        includedLayers.forEach(layerName => {
            const layer = layers.find(l => l.id === layerName);
            
            if (layer) {
                const item = document.createElement('div');
                item.style.marginBottom = '5px';
                
                // Special handling for Point of Interest
                if (layer.id === 'Point of Interest') {
                    const img = document.createElement('img');
                    img.id = 'legend-icon';
                    img.src = 'https://roguerivergreenway.org/wp-content/uploads/2025/11/map_emerald.png';
                    img.alt = 'Point of Interest';
                    item.appendChild(img);
                } else {
                    // Get color from layer paint properties
                    let color = '#888';
                    if (layer.paint) {
                        color = layer.paint['fill-color'] || 
                                layer.paint['line-color'] || 
                                layer.paint['circle-color'] || 
                                layer.paint['text-color'] || 
                                '#888';
                        
                        // Handle arrays (for data-driven styling)
                        if (Array.isArray(color)) {
                            color = color[color.length - 1];
                        }
                    }
                    
                    const span = document.createElement('span');
                    
                    // Special handling for rrg-proposed (yellow and black dashed)
                    if (layer.id === 'Proposed') {
                        span.style.background = 'repeating-linear-gradient(90deg, #ffff00 0px, #ffff00 5px, #000000 5px, #000000 10px)';
                    } else {
                        span.style.backgroundColor = color;
                    }
                    
                    item.appendChild(span);
                }
                
                const label = document.createTextNode(layer.id);
                
                item.appendChild(label);
                legendContent.appendChild(item);
            }
        });
        
        if (legendContent.children.length === 0) {
            legendContent.innerHTML = '<em>No layers to display</em>';
        }

        // Add click event for Point of Interest layer
        map.on('click', 'Point of Interest', function(e) {
            if (e.features.length > 0) {
                const feature = e.features[0];
                const coordinates = e.lngLat;
                const properties = feature.properties;
                
                // Get the text field (adjust property name based on your data)
                const title = properties.name || properties.text || properties.title || 'Point of Interest';
                const description = properties.description || properties.desc || '';
                
                // Create Google Maps directions link
                const directionsUrl = `https://www.google.com/maps/dir/?api=1&destination=${coordinates.lat},${coordinates.lng}`;
                
                // Add website link if available
                const websiteLink = properties.website 
                    ? `<a href="${properties.website}" target="_blank" class="popup-directions" style="margin-left: 5px;">Website</a>` 
                    : '';
                
                // Add parking information if available
                const parkingInfo = properties.parking 
                    ? `<ul style="margin: 8px 0; padding-left: 20px; font-size: 12px;"><li>Parking: ${properties.parking}</li></ul>` 
                    : '';
                
                // Create popup HTML
                const popupHTML = `
                    <div class="popup-title">${title}</div>
                    <a href="${directionsUrl}" target="_blank" class="popup-directions">Get Directions</a>${websiteLink}
                    <div class="popup-description">${description}</div>${parkingInfo}
                `;
                
                // Calculate max height as 90% of map height
                const mapHeight = map.getContainer().offsetHeight;
                const maxPopupHeight = mapHeight * 0.9;
                
                const popup = new mapboxgl.Popup()
                    .setLngLat(coordinates)
                    .setHTML(popupHTML)
                    .addTo(map);
                
                // Set max-height after popup is added
                const popupElement = popup.getElement();
                const popupContent = popupElement.querySelector('.mapboxgl-popup-content');
                if (popupElement && popupContent) {
                    popupElement.style.maxHeight = `${maxPopupHeight}px`;
                    popupContent.style.maxHeight = `${maxPopupHeight}px`;
                    popupContent.style.overflowY = 'auto';
                }
            }
        });

        // Change cursor to pointer when hovering over POI
        map.on('mouseenter', 'Point of Interest', function() {
            map.getCanvas().style.cursor = 'pointer';
        });

        map.on('mouseleave', 'Point of Interest', function() {
            map.getCanvas().style.cursor = '';
        });
    });

    // Toggle legend function
    function toggleLegend() {
        const legend = document.getElementById('legend');
        const toggleButton = document.getElementById('legend-toggle');
        const tabButton = document.getElementById('legend-toggle-tab');
        
        if (legend.classList.contains('hidden')) {
            legend.classList.remove('hidden');
            tabButton.classList.remove('visible');
        } else {
            legend.classList.add('hidden');
            tabButton.classList.add('visible');
        }
    }
</script>


</body>
</html>
